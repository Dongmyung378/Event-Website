spring.h2.console.enabled=false
spring.devtools.add-properties=false
server.port=${EVENTLITE_PORT:${PORT:8080}}
spring.datasource.url=${EVENTLITE_DATASOURCE_URL:jdbc:h2:file:./db/eventlite-dev}
spring.datasource.username=${EVENTLITE_DATASOURCE_USERNAME:h2}
spring.datasource.password=${EVENTLITE_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${EVENTLITE_DDL_AUTO:update}
spring.jpa.properties.jakarta.persistence.validation.mode=none

# No administrator is created unless configured, or the demo profile is explicitly enabled.
eventlite.admin.username=${EVENTLITE_ADMIN_USERNAME:}
eventlite.admin.password=${EVENTLITE_ADMIN_PASSWORD:}

# External services are disabled without credentials. Keep server and browser Mapbox tokens separate.
eventlite.mastodon.instance=${EVENTLITE_MASTODON_INSTANCE:}
eventlite.mastodon.token=${EVENTLITE_MASTODON_TOKEN:}
eventlite.mastodon.account-id=${EVENTLITE_MASTODON_ACCOUNT_ID:}
eventlite.mapbox.token=${EVENTLITE_MAPBOX_TOKEN:}
eventlite.mapbox.public-token=${EVENTLITE_MAPBOX_PUBLIC_TOKEN:}
eventlite.integrations.timeout-millis=3000
