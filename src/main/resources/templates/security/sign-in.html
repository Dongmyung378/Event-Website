<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/default}">
<head><title>Sign in</title></head>
<body>
<div layout:fragment="content">
  <h1>Sign in</h1>
  <div class="alert alert-danger" role="alert" th:if="${param.error}">Invalid user name or password.</div>
  <form th:action="@{/sign-in}" method="post" class="col-md-6">
    <div class="mb-3">
      <label class="form-label" for="username">User name</label>
      <input class="form-control" type="text" name="username" id="username" autocomplete="username" autofocus required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" name="password" id="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
    <a class="btn btn-warning" th:href="@{/home}">Cancel</a>
  </form>
</div>
</body>
</html>
