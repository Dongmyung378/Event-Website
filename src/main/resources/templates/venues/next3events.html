<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/default}">
<head><title>Next three events</title></head>
<body>
<div layout:fragment="content">
  <h1>Next 3 events</h1>
  <p>At <a th:href="@{/venues/{id}(id=${venue.id})}" th:text="${venue.name}"></a></p>
  <p th:if="${#lists.isEmpty(events)}" class="text-muted">No events to display.</p>
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark"><tr><th scope="col">Event Name</th><th scope="col">Date</th><th scope="col">Time</th></tr></thead>
      <tbody>
        <tr th:each="e : ${events}">
          <td><a th:href="@{/events/{id}(id=${e.id})}" th:text="${e.name}"></a></td>
          <td th:text="${e.date != null ? #temporals.format(e.date, 'yyyy-MM-dd') : 'Not specified'}"></td>
          <td th:text="${e.time ?: 'Not specified'}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="d-flex flex-wrap gap-2 mt-4">
    <a th:href="@{/venues/{id}(id=${venue.id})}" class="btn btn-secondary">Return to venue</a>
    <a th:href="@{/venues}" class="btn btn-outline-secondary">All venues</a>
  </div>
</div>
</body>
</html>
