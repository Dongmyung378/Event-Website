<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/default}">
<head><title>Venue Details</title></head>
<body>
<div layout:fragment="content">
  <h1 th:text="${venue.name}">Venue Name</h1>
  <p><strong>Road:</strong> <span th:text="${venue.road}"></span></p>
  <p><strong>Postcode:</strong> <span th:text="${venue.postcode}"></span></p>
  <p><strong>Capacity:</strong> <span th:text="${venue.capacity}"></span></p>
  <h2>Next three upcoming events</h2>
  <p th:if="${#lists.isEmpty(events)}" class="text-muted">No upcoming events at this venue.</p>
  <div class="table-responsive" th:unless="${#lists.isEmpty(events)}">
    <table class="table table-striped table-hover">
      <thead><tr><th scope="col">Event</th><th scope="col">Date</th><th scope="col">Time</th></tr></thead>
      <tbody>
        <tr th:each="e : ${events}">
          <td><a th:href="@{/events/{id}(id=${e.id})}" th:text="${e.name}"></a></td>
          <td th:text="${#temporals.format(e.date, 'yyyy-MM-dd')}"></td>
          <td th:text="${e.time ?: 'Not specified'}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="d-flex flex-wrap gap-3 my-3">
    <a th:href="@{/venues/{id}/events(id=${venue.id})}">All Events</a>
    <a th:href="@{/venues/{id}/next3events(id=${venue.id})}">Next 3 events</a>
  </div>
  <div class="d-flex flex-wrap gap-2 mt-4">
    <a th:href="@{/venues}" class="btn btn-secondary">Return to venues</a>
    <form sec:authorize="hasRole('ADMINISTRATOR')" th:action="@{/venues/{id}(id=${venue.id})}" th:method="delete" class="mb-0">
      <button type="submit" class="btn btn-danger">Delete</button>
    </form>
    <a class="btn btn-primary" th:href="@{/venues/update/{id}(id=${venue.id})}" sec:authorize="hasRole('ADMINISTRATOR')">Update</a>
  </div>
</div>
</body>
</html>
