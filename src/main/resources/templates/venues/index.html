<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/default}">
<head><title>All venues</title></head>
<body>
<div layout:fragment="content">
  <h1>Venue List</h1>
  <form th:action="@{/venues/search}" method="get" class="mb-3" role="search">
    <label for="venue-query" class="form-label">Search venues by name</label>
    <div class="input-group search-group">
      <input id="venue-query" type="search" name="q" th:value="${query}" placeholder="Search by name" class="form-control" required pattern=".*\S.*">
      <button type="submit" class="btn btn-primary">Search</button>
      <a th:href="@{/venues}" class="btn btn-outline-primary">View All</a>
    </div>
  </form>
  <p th:if="${query != null}">Search results for “<span th:text="${query}"></span>”</p>
  <nav th:replace="~{fragments/pagination :: pages('/venues', '/venues/search')}"></nav>
  <h2 class="mt-4 text-success">Venues</h2>
  <p th:if="${#lists.isEmpty(venues)}" class="text-muted">No venues found.</p>
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead><tr><th scope="col">Venue</th><th scope="col">Address</th><th scope="col">Postcode</th><th scope="col">Capacity</th></tr></thead>
      <tbody>
        <tr th:each="v : ${venues}">
          <td><a th:href="@{/venues/{id}(id=${v.id})}" th:text="${v.name}"></a></td>
          <td th:text="${v.road}"></td>
          <td th:text="${v.postcode}"></td>
          <td th:text="${v.capacity}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-primary" th:href="@{/venues/new}" sec:authorize="hasRole('ADMINISTRATOR')">Add new venue</a>
    <a class="btn btn-primary" th:href="@{/events}">Event List</a>
    <a class="btn btn-primary" th:href="@{/home}">Back To Homepage</a>
  </div>
</div>
</body>
</html>
