<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/default}">
<head><title>Home</title></head>
<body>
<div layout:fragment="content">
  <h1>EventLite</h1>
  <h2 class="mt-4 text-success">Next Three Upcoming Events</h2>
  <p th:if="${#lists.isEmpty(events)}" class="text-muted">No upcoming events.</p>
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead><tr><th scope="col">Event</th><th scope="col">Venue</th><th scope="col">Date</th><th scope="col">Time</th></tr></thead>
      <tbody>
        <tr th:each="e : ${events}">
          <td><a th:href="@{/events/{id}(id=${e.id})}" th:text="${e.name}"></a></td>
          <td><a th:if="${e.venue != null}" th:href="@{/venues/{id}(id=${e.venue.id})}" th:text="${e.venue.name}"></a><span th:if="${e.venue == null}">Unknown venue</span></td>
          <td th:text="${e.date != null ? #temporals.format(e.date, 'yyyy-MM-dd') : 'Not specified'}"></td>
          <td th:text="${e.time ?: 'Not specified'}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <h2 class="mt-4 text-success">Most Popular Venues</h2>
  <p th:if="${#lists.isEmpty(venues)}" class="text-muted">No venues found.</p>
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead><tr><th scope="col">Venue</th><th scope="col">Address</th><th scope="col">Postcode</th><th scope="col">Capacity</th></tr></thead>
      <tbody>
        <tr th:each="v : ${venues}">
          <td><a th:href="@{/venues/{id}(id=${v.id})}" th:text="${v.name}"></a></td>
          <td th:text="${v.road}"></td>
          <td th:text="${v.postcode}"></td>
          <td th:text="${v.capacity}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-primary" th:href="@{/venues}">Venue List</a>
    <a class="btn btn-primary" th:href="@{/events}">Event List</a>
  </div>
</div>
</body>
</html>
