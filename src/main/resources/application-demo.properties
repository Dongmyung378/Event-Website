# Opt-in, disposable local demo. It never opens or changes the existing file database.
spring.datasource.url=jdbc:h2:mem:eventlite-demo;DB_CLOSE_DELAY=-1
spring.datasource.username=demo
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
eventlite.mastodon.instance=
eventlite.mastodon.token=
eventlite.mastodon.account-id=
eventlite.mapbox.token=
eventlite.mapbox.public-token=
